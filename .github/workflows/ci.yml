name: CI

# Runs entirely on mock providers — no secrets/API keys required or used.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  RESEARCHFORGE_ENVIRONMENT: test
  RESEARCHFORGE_SEARCH_PROVIDER: mock
  RESEARCHFORGE_LLM_PROVIDER: mock
  RESEARCHFORGE_DATABASE_URL: "sqlite+aiosqlite:///:memory:"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: pip install -e ".[dev,anthropic,openai,linkup]"

      - name: Lint (ruff)
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Type check (mypy)
        run: mypy src
        continue-on-error: true # non-blocking until the full codebase is mypy-clean

      - name: Run tests
        run: pytest -q --cov=researchforge --cov-report=term-missing

      - name: Dependency vulnerability scan
        run: |
          pip install pip-audit
          pip-audit -r <(pip freeze) || true # non-blocking: report, don't fail the build on advisories

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build
